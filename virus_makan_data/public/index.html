<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Data Eater - PPLG</title>
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none;
            overscroll-behavior: none;
        }

        #loginPanel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
            width: 85%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 20;
            box-sizing: border-box;
        }

        input {
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            margin: 10px 0;
            width: 100%;
            border: none;
            box-sizing: border-box;
            text-align: center;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            background: #38bdf8;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: 0.2s;
        }

        button:hover {
            background: #0ea5e9;
        }

        #gameContainer {
            display: none;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #1e293b;
        }

        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #gameOverScreen h1 {
            color: #ef4444;
            font-size: 40px;
            margin-bottom: 10px;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            margin-top: 20px;
            width: auto;
            padding: 10px 30px;
        }
    </style>
</head>

<body>
    <div id="loginPanel">
        <h1 style="color:#38bdf8; margin-top:0;">🦠 Data Eater</h1>
        <p style="font-size: 14px; color:#94a3b8;">Makan item ⚡ & 🧲! Capai 5.000 Poin untuk Level Up & Kecepatan Tambahan!</p>
        <input type="text" id="playerName" placeholder="Nama Kamu..." required>
        <button onclick="joinGame()">Mulai Main!</button>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="gameOverScreen">
            <h1>KAMU DIMAKAN! 💀</h1>
            <h2 id="finalScore">Skor Akhir: 0</h2>
            <button class="btn-danger" onclick="location.reload()">Main Lagi</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let myId = null;
        let myLastScore = 0;
        let myLastLevel = 1;
        let wasBoosted = false;
        let wasMagnet = false;
        let isDead = false;

        const WORLD_W = 3000;
        const WORLD_H = 2000;
        let camX = 0;
        let camY = 0;

        let currentState = { players: {}, foods: [], speedBoosts: [], magnets: [] };

        let targetPoint = null;
        const MINI_MARGIN = 16;

        function minimapRect() {
            const w = Math.min(180, canvas.width * 0.35);
            const h = w * (WORLD_H / WORLD_W);
            return {
                x: canvas.width - w - MINI_MARGIN,
                y: canvas.height - h - MINI_MARGIN,
                w: w,
                h: h,
                scale: w / WORLD_W
            };
        }
        
        let audioCtx;
        let particles = [];
        let bgmInterval;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function startBGM() {
            const notes = [110.00, 130.81, 146.83, 130.81];
            let step = 0;

            bgmInterval = setInterval(() => {
                if (!audioCtx || isDead) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'square';
                osc.frequency.value = notes[step % notes.length];

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.15);

                step++;
            }, 250);
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'boost') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'magnet') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'levelup') {
                // Suara Fanfare Level Up
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'chomp') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'die') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        function spawnParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    life: 1.0,
                    color: color
                });
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function joinGame() {
            const nama = document.getElementById('playerName').value;
            if (!nama) return alert('Isi nama dulu!');

            initAudio();
            startBGM();

            myId = socket.id;
            socket.emit('joinGame', nama);

            document.getElementById('loginPanel').style.display = 'none';
            document.getElementById('gameContainer').style.display = 'block';
        }

        function sendTarget(clientX, clientY) {
            const targetX = clientX + camX;
            const targetY = clientY + camY;
            targetPoint = { x: targetX, y: targetY };
            socket.emit('move', { x: targetX, y: targetY });
        }

        canvas.addEventListener('mousemove', (e) => sendTarget(e.clientX, e.clientY));
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            sendTarget(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            sendTarget(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        socket.on('gameState', (state) => {
            currentState = state;
        });
        
        function drawMinimap() {
            const m = minimapRect();
            ctx.save();

            ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
            ctx.fillRect(m.x, m.y, m.w, m.h);
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.strokeRect(m.x, m.y, m.w, m.h);

            ctx.globalAlpha = 0.5;
            currentState.foods.forEach(f => {
                ctx.fillStyle = f.color;
                ctx.fillRect(m.x + f.x * m.scale - 1, m.y + f.y * m.scale - 1, 2, 2);
            });
            ctx.globalAlpha = 1;

            ctx.beginPath();
            ctx.rect(m.x, m.y, m.w, m.h);
            ctx.clip();

            for (let id in currentState.players) {
                const p = currentState.players[id];
                if (p.isGameOver) continue;

                const px = m.x + p.x * m.scale;
                const py = m.y + p.y * m.scale;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(px, py, Math.max(2, p.radius * m.scale * 1.5), 0, Math.PI * 2);
                ctx.fill();

                if (id === myId) {
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = 1;
            ctx.strokeRect(
                m.x + camX * m.scale,
                m.y + camY * m.scale,
                Math.min(canvas.width * m.scale, m.w),
                Math.min(canvas.height * m.scale, m.h)
            );

            ctx.restore();
        }

        function drawLeaderboard(me) {
            const list = Object.values(currentState.players)
                .filter(p => !p.isGameOver)
                .sort((a, b) => b.score - a.score);
            const top = list.slice(0, 5);

            let ownRank = 0;
            if (me && !me.isGameOver) {
                const index = list.findIndex(p => p.id === myId);
                if (index >= 5) ownRank = index + 1;
            }

            const panelW = Math.min(200, canvas.width * 0.45);
            const rowH = 20;
            const headerH = 26;
            const rows = top.length + (ownRank ? 1 : 0);
            const panelH = headerH + rows * rowH + 6;
            const x = canvas.width - panelW - MINI_MARGIN;
            const y = MINI_MARGIN;

            ctx.save();
            ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
            ctx.fillRect(x, y, panelW, panelH);
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, panelW, panelH);

            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#38bdf8';
            ctx.font = 'bold 13px Arial';
            ctx.fillText('TOP 5', x + 10, y + 14);

            ctx.font = '12px Arial';

            const drawRow = (p, rank, rowIndex) => {
                const rowY = y + headerH + rowIndex * rowH + rowH / 2;
                const rawName = String(p.nama);
                const name = rawName.length > 14 ? rawName.slice(0, 13) + '...' : rawName;
                ctx.fillStyle = p.id === myId ? '#38bdf8' : 'white';
                ctx.textAlign = 'left';
                ctx.fillText(`${rank}. ${name}`, x + 10, rowY);
                ctx.textAlign = 'right';
                ctx.fillText(p.score, x + panelW - 10, rowY);
            };

            top.forEach((p, i) => drawRow(p, i + 1, i));
            if (ownRank) drawRow(me, ownRank, top.length);

            ctx.restore();
        }
        
        // --- RENDER ENGINE 60FPS ---
        function renderGame() {
            requestAnimationFrame(renderGame);

            if (document.getElementById('gameContainer').style.display === 'none') return;

            let state = currentState;
            if (!state.players || Object.keys(state.players).length === 0) return;

            let me = state.players[myId];

            if (me && !me.isGameOver && !targetPoint) {
                targetPoint = { x: me.x, y: me.y };
                socket.emit('move', { x: me.x, y: me.y });
            }
            
            // Logika Kamera
            if (me && !me.isGameOver) {
                camX = me.x - (canvas.width / 2);
                camY = me.y - (canvas.height / 2);

                if (canvas.width > WORLD_W) camX = (WORLD_W - canvas.width) / 2;
                else camX = Math.max(0, Math.min(WORLD_W - canvas.width, camX));

                if (canvas.height > WORLD_H) camY = (WORLD_H - canvas.height) / 2;
                else camY = Math.max(0, Math.min(WORLD_H - canvas.height, camY));
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(-camX, -camY);

            // Render Latar Belakang & Grid
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, WORLD_W, WORLD_H);

            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            for (let x = 0; x <= WORLD_W; x += 50) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_H); ctx.stroke();
            }
            for (let y = 0; y <= WORLD_H; y += 50) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_W, y); ctx.stroke();
            }
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 5;
            ctx.strokeRect(0, 0, WORLD_W, WORLD_H);

            let showTarget = false;
            if (me && !me.isGameOver && targetPoint) {
                const targetDist = Math.hypot(targetPoint.x - me.x, targetPoint.y - me.y);
                if (targetDist > me.radius + 8) {
                    showTarget = true;
                    ctx.save();
                    ctx.setLineDash([6, 6]);
                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.55)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(me.x, me.y);
                    ctx.lineTo(targetPoint.x, targetPoint.y);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            // Render Makanan
            if (state.foods) {
                state.foods.forEach(f => {
                    ctx.fillStyle = f.color;
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, 5, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            // Render Item Speed Boost ⚡
            if (state.speedBoosts) {
                ctx.font = '22px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                state.speedBoosts.forEach(sb => {
                    ctx.fillText('⚡', sb.x, sb.y);
                });
            }

            // Render Item Magnet 🧲
            if (state.magnets) {
                ctx.font = '22px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                state.magnets.forEach(m => {
                    ctx.fillText('🧲', m.x, m.y);
                });
            }

            // Render Pemain (Sel)
            for (let id in state.players) {
                let p = state.players[id];
                if (p.isGameOver) continue;

                // Visual Garis Lingkaran Magnet saat Magnet Aktif
                if (p.magnetTimer > 0) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius + 15, 0, Math.PI * 2);
                    ctx.strokeStyle = "rgba(56, 189, 248, 0.6)";
                    ctx.lineWidth = 4;
                    ctx.setLineDash([8, 8]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                // Efek Glowing jika Speed Boost Aktif
                if (p.speedBoostTimer > 0) {
                    ctx.save();
                    ctx.shadowColor = '#facc15';
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } else {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.lineWidth = 3;
                ctx.strokeStyle = p.speedBoostTimer > 0 ? '#facc15' : "rgba(255,255,255,0.5)";
                ctx.stroke();

                let fontSize = Math.max(12, p.radius * 0.4);
                ctx.fillStyle = "white";
                ctx.font = `bold ${fontSize}px Arial`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                
                // Tanda Level dan Status Item pada Nama Pemain
                let tag = `[Lvl ${p.level}] ${p.nama}`;
                if (p.speedBoostTimer > 0) tag += ' ⚡';
                if (p.magnetTimer > 0) tag += ' 🧲';

                ctx.fillText(tag, p.x, p.y);
            }

            if (showTarget) {
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(targetPoint.x, targetPoint.y, 10, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(targetPoint.x - 14, targetPoint.y);
                ctx.lineTo(targetPoint.x + 14, targetPoint.y);
                ctx.moveTo(targetPoint.x, targetPoint.y - 14);
                ctx.lineTo(targetPoint.x, targetPoint.y + 14);
                ctx.stroke();
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.arc(targetPoint.x, targetPoint.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
            
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;

                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;

                if (p.life <= 0) particles.splice(i, 1);
            }

            ctx.restore();

            if (me) {
                drawMinimap();
                drawLeaderboard(me);
            }

            // Cek Trigger Suara dan Game Over
            if (me && !me.isGameOver) {
                // Trigger Suara Level Up
                if (me.level > myLastLevel) {
                    playSound('levelup');
                    spawnParticles(me.x, me.y, '#38bdf8', 40);
                    myLastLevel = me.level;
                }

                if (me.score > myLastScore) {
                    let scoreDiff = me.score - myLastScore;
                    if (scoreDiff === 5) {
                        playSound('pop');
                    } else {
                        playSound('chomp');
                        spawnParticles(me.x, me.y, me.color, 30);
                    }
                    myLastScore = me.score;
                }

                if (me.speedBoostTimer > 0 && !wasBoosted) {
                    playSound('boost');
                    spawnParticles(me.x, me.y, '#facc15', 25);
                    wasBoosted = true;
                } else if (me.speedBoostTimer <= 0) {
                    wasBoosted = false;
                }

                if (me.magnetTimer > 0 && !wasMagnet) {
                    playSound('magnet');
                    spawnParticles(me.x, me.y, '#38bdf8', 25);
                    wasMagnet = true;
                } else if (me.magnetTimer <= 0) {
                    wasMagnet = false;
                }
            }

            // Logika Kematian
            if (me && me.isGameOver && !isDead) {
                playSound('die');
                clearInterval(bgmInterval);
                isDead = true;

                document.getElementById('gameOverScreen').style.display = 'flex';
                document.getElementById('finalScore').innerText = `Skor Terakhir: ${me.score} (Level ${me.level})`;
            }
        }

        renderGame();
    </script>
</body>

</html>
